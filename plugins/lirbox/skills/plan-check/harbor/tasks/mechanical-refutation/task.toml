[task]
name = "lirbox/plan-check__mechanical-refutation"
version = "1.0.0"
description = "plan-check skill task: a plan whose critical-path refutation is MECHANICALLY repairable (a make target that does not exist) — it is a condition (not NO-GO), autofix repairs it in place, and the live-system unknown stays a condition"

[metadata]
skill = "plan-check"
difficulty = "medium"
category = "plan-verification"

[environment]
cpus = 2
memory_mb = 2048
build_timeout_sec = 900

[agent]
timeout_sec = 1800.0

[verifier]
# Deterministic only — a static verifier, no judge and no model calls. No [verifier.env]:
# nothing here needs a credential, and Harbor aborts the run on any declared-but-unset variable.
timeout_sec = 300.0
