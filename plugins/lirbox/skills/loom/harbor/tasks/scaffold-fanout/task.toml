# loom's second Harbor task. The graph is authored, never executed.
#
# WHY THIS TASK EXISTS (2026-08-06). Issue #67: the graph was a single-cursor state machine, so
# "these three are independent" could not be said at all. `fork`/`join` fixes that. loom's tier-2
# floor now proves the region rules hold and that the emitted conductor really runs branches under
# parallel() — but those are artifact-level, and they stay green with SKILL.md trimmed to nothing.
# This task grades what they cannot see: whether a model GIVEN the skill reaches for the mechanism
# on a goal it has never seen, having been told only that the work is independent.
#
# ITS CRITERIA SPLIT DELIBERATELY, and reading them apart is the whole point:
#
#   PRE-EXISTING CONTRACT — graph_exists, gate_enforced, failure_edge_routes_back,
#   back_edge_carries_findings. The baseline (loom at git HEAD, no fork support) can score every
#   one of these. This half answers "is the change NO WORSE" and is the only half where comparing
#   the two arms means anything.
#
#   NEW CAPABILITY — declares_a_fork, branches_are_disjoint, region_has_one_exit,
#   no_gate_inside_a_branch. The baseline cannot express a fork at all, so a 0 here measures the
#   feature's absence, not the model. Read the AFTER arm absolute; a "lift" on these four is
#   arithmetic, not evidence.
#
# The graders reimplement reachability in Python rather than importing the skill's graph-core.mjs:
# grading the code under test with the code under test proves only that it agrees with itself.

[task]
name = "lirbox/loom__scaffold-fanout"
version = "1.0.0"
description = "loom must author a graph that runs independent work concurrently, joins it, and keeps the gate un-bypassable"

[metadata]
skill = "loom"
difficulty = "medium"
category = "agent-workflow-authoring"

[environment]
cpus = 2
memory_mb = 4096

[agent]
timeout_sec = 900.0

[verifier]
timeout_sec = 900.0

# Only the subscription token is declared. Harbor validates this table BEFORE the run and aborts on
# any unset variable, so declaring ANTHROPIC_API_KEY here would make the task unrunnable for anyone
# holding only a subscription token; pass an API key ad hoc with --ve instead.
[verifier.env]
CLAUDE_CODE_OAUTH_TOKEN = "${CLAUDE_CODE_OAUTH_TOKEN}"
